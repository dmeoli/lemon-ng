# The variants that conda-forge gives a recipe (from its pinning), so that
# the CI builds the recipe with the same compilers and C library; conda-forge
# itself does not read this file.
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
  - if: win
    then: vs
c_stdlib_version:
  - if: linux
    then: "2.17"
  - if: osx and arm64
    then: "11.0"
  - if: osx and x86_64
    then: "10.13"
  - if: win
    then: "2019"
cxx_compiler:
  - if: linux
    then: gxx
  - if: osx
    then: clangxx
  - if: win
    then: vs2019
cxx_compiler_version:
  - if: linux
    then: "14"
  - if: osx
    then: "19"
